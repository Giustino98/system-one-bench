# This does not use API keys, but stays dry-run until you deliberately enable it.
dataset:
  name: PolyAI/banking77
  split: test
  data_files:
    train: https://huggingface.co/datasets/PolyAI/banking77/resolve/8eed2b348ec07d40ffbe91dcc4718e2f0f977714/data/train-00000-of-00001.parquet
    test: https://huggingface.co/datasets/PolyAI/banking77/resolve/8eed2b348ec07d40ffbe91dcc4718e2f0f977714/data/test-00000-of-00001.parquet
  limit: null
model:
  kind: lmstudio_qwen
  # LM Studio identifier for the loaded mlx-community/Qwen2.5-3B-Instruct-4bit checkpoint.
  name: qwen2.5-3b-instruct
  base_url: http://127.0.0.1:1234/v1
  timeout_seconds: 120
  max_tokens: 12
  temperature: 0.0
run:
  output_dir: results
  seed: 42
  dry_run: false
  persist_raw_responses: false
