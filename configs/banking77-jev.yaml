# Safe by default: `system-one-bench run` refuses this until dry_run becomes false.
dataset:
  name: PolyAI/banking77
  split: test
  limit: 25  # Start with a cheap, inspectable pilot; remove for the full test split.
model:
  kind: jev
  name: jev-latest
  api_key_env: TYPESAFE_API_KEY
  base_url: https://api.typesafe.ai
  timeout_seconds: 30
  pricing:
    # Verified against TypeSafe's published rate on 2026-09-21.
    input_per_million_usd: 0.042
    output_per_million_usd: 0.0
run:
  output_dir: results
  seed: 42
  dry_run: true
  persist_raw_responses: false
