# Safe cloud smoke configuration. Set dry_run to false only after reviewing the plan.
dataset:
  kind: bbh_logical_deduction
  name: lighteval/bbh
  revision: 1b61f099fcbf9e55691ef8cc6b4b8fb431dae097
  split: train
  tasks:
    - logical_deduction_three_objects
    - logical_deduction_five_objects
    - logical_deduction_seven_objects
  instruction: Choose the option that follows from the problem.
  limit: null
model:
  kind: gemini
  name: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta
  timeout_seconds: 120
  max_retries: 3
