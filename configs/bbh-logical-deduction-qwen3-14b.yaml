# Native MLX smoke configuration. The limit is per task (3 = 9 samples total).
dataset:
  kind: bbh_logical_deduction
  name: lighteval/bbh
  revision: 1b61f099fcbf9e55691ef8cc6b4b8fb431dae097
  split: train
  tasks:
    - logical_deduction_three_objects
    - logical_deduction_five_objects
    - logical_deduction_seven_objects
  instruction: Choose the option that follows from the problem.
  limit: null
model:
  kind: mlx_qwen
  name: lmstudio-community/Qwen3-14B-MLX-4bit
  model_path: ~/.lmstudio/models/lmstudio-community/Qwen3-14B-MLX-4bit
  structured_output: true
  max_tokens: 8192
  thinking: true
  temperature: 0
  top_p: 0.95
  top_k: 20
  seed: 42
run:
  output_dir: results
  seed: 42
  dry_run: false
  persist_raw_responses: true
  continue_on_error: true
