# Safe local smoke configuration. The 14B checkpoint is loaded only for a live run.
dataset:
  kind: bbh_logical_deduction
  name: lighteval/bbh
  revision: 1b61f099fcbf9e55691ef8cc6b4b8fb431dae097
  split: train
  tasks:
    - logical_deduction_three_objects
    - logical_deduction_five_objects
    - logical_deduction_seven_objects
  instruction: Choose the option that follows from the problem.
  limit: 3  # Per task: nine examples total in the smoke run.
model:
  kind: lmstudio_qwen
  name: mlx-community/Qwen3-14B-4bit
  # API identifier shown by the loaded LM Studio model on this Mac.
  api_model: qwen/qwen3-14b
  lmstudio_api: native
  base_url: http://127.0.0.1:1234
  timeout_seconds: 300
  max_tokens: 1024
  thinking: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  seed: 42
run:
  output_dir: results
  seed: 42
  dry_run: true
  persist_raw_responses: true
