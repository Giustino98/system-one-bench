[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "system-one-bench"
version = "0.1.0"
description = "A reproducible Jev vs Qwen benchmark on BBH Logical Deduction."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "datasets>=3.0",
  "httpx>=0.27",
  "numpy>=1.26,<2.4",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
local = ["mlx-lm>=0.18"]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "types-PyYAML>=6.0"]

[project.scripts]
system-one-bench = "system_one_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/system_one_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["datasets", "sklearn.*"]
ignore_missing_imports = true
